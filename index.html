<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>1st Card Buys</title>
  <meta name="apple-mobile-web-app-title" content="1st Card Buys">
  <meta name="application-name" content="1st Card Buys">
  <meta name="theme-color" content="#000000">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <script>
    // ▼▼ Paste your web app link (ends in /exec) between the quotes. ▼▼
    var APP_URL = 'https://script.google.com/macros/s/AKfycbw1I-sO3_7_AHh5EHFRkTUlSPO3pZ68rz4rAuFMaU4TTzUAT1cRuwx_-egj584qdWxn/exec';
    // ▲▲ That's the only line to change. ▲▲

    var ready = /^https:\/\/script\.google\.com\/.+\/exec$/.test(APP_URL);
    // Opened from the home-screen icon: go straight to the tracker.
    if (ready && (/[?&]home=1/.test(location.search) || navigator.standalone)) {
      location.replace(APP_URL);
    }
  </script>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; background: #000; color: #eee;
      font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center; }
    main { width: 100%; max-width: 420px; padding: 28px 16px; box-sizing: border-box; text-align: center; }
    img { width: 150px; height: 150px; border-radius: 34px; }
    h1 { font-size: 21px; margin: 18px 0 4px; }
    p { color: #aaa; margin: 0 0 22px; }
    a.btn { display: block; padding: 16px; border-radius: 14px; background: linear-gradient(#f3d27a, #c9a034);
      color: #111; font-weight: 700; font-size: 18px; text-decoration: none; }
    .how { text-align: left; background: #141416; border: 1px solid #2a2a2e; border-radius: 14px;
      padding: 14px 16px; margin-top: 22px; font-size: 15px; }
    .how b { color: #e6c35c; }
    .how ol { margin: 6px 0 12px; padding-left: 20px; }
    .how ol:last-child { margin-bottom: 0; }
    .err { color: #ff8a80; }
  </style>
</head>
<body>
  <main>
    <img src="icon-512.png" alt="1st Card Collectibles Show Buying Tracker">
    <h1>Show Buying Tracker</h1>
    <p>1st Card Collectibles</p>
    <a class="btn" id="open" href="#">Open Tracker</a>
    <div class="how">
      <b>Put it on your home screen</b>
      <div><b>iPhone</b> (in Safari):</div>
      <ol><li>Tap the <b>Share</b> button (square with arrow).</li><li>Tap <b>Add to Home Screen</b>, then <b>Add</b>.</li></ol>
      <div><b>Android</b> (in Chrome):</div>
      <ol><li>Tap the <b>⋮</b> menu.</li><li>Tap <b>Add to Home screen</b>, then <b>Add</b>.</li></ol>
    </div>
  </main>
  <script>
    var btn = document.getElementById('open');
    if (ready) {
      btn.href = APP_URL;
      // Make the saved home-screen shortcut open the tracker directly next time.
      if (!/[?&]home=1/.test(location.search)) history.replaceState(null, '', '?home=1');
    } else {
      btn.textContent = 'Not set up yet';
      btn.removeAttribute('href');
      document.querySelector('p').innerHTML = '<span class="err">The tracker link hasn\'t been added to this page yet.</span>';
    }
  </script>
</body>
</html>
